name: 功能建议 / Feature request
description: 想要的新功能或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！这是个人项目，没有固定的响应时间，也不保证采纳每个建议。
        这个项目只能在 Windows 上运行和测试，实现需要在 Windows 上验证，所以采纳和发布会比较慢。
        **不要贴个人信息。**
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你现在遇到了什么不方便，或者想要什么效果。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你期望的做法
      description: 越具体越好。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法（可选）
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我搜过已有的 Issue，没有找到相同的建议。
          required: true
